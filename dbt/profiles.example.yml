# Sao chep thanh dbt/profiles.yml (da bi .gitignore) hoac ~/.dbt/profiles.yml
# Can: pip install dbt-trino  va  port-forward Trino:
#   kubectl -n lakehouse port-forward svc/trino-coordinator 8080:8080
lakehouse_stock:
  target: dev
  outputs:
    dev:
      type: trino
      method: none            # Trino trong cum khong bat xac thuc
      host: localhost
      port: 8080
      user: dbt
      database: iceberg       # catalog Trino
      schema: analytics       # dbt ghi bang vao iceberg.analytics (khong dung vao schema stock cua Spark)
      threads: 2
