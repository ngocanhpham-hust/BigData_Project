name: 'lakehouse_stock'
version: '1.0.0'
config-version: 2

profile: 'lakehouse_stock'
model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lakehouse_stock:
    staging:
      +materialized: view
    intermediate:
      +materialized: view
    marts:
      +materialized: table

seeds:
  lakehouse_stock:
    seed_dim_symbol:
      +column_types:
        symbol: varchar
        company_name: varchar
        exchange: varchar
        listed_date: varchar
        icb_code: varchar
        sector: varchar
