apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: lakehouse
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-driver
  namespace: lakehouse
rules:
  - apiGroups: [""]
    resources: [pods, services, configmaps]
    verbs: [get, list, watch, create, delete, deletecollection, patch, update]
  # Spark 3.5 also performs labelled PVC cleanup, even with emptyDir local storage.
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [get, list, watch, deletecollection]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-driver
  namespace: lakehouse
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: lakehouse
roleRef:
  kind: Role
  name: spark-driver
  apiGroup: rbac.authorization.k8s.io
