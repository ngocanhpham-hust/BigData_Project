# ⚠️ Mật khẩu demo, khớp với báo cáo K8s gốc để dễ đối chiếu kết quả.
# KHÔNG dùng cho môi trường thật. Khi dùng thật, tạo Secret bằng lệnh:
#   kubectl create secret generic minio-secret -n lakehouse \
#     --from-literal=MINIO_ROOT_USER=... --from-literal=MINIO_ROOT_PASSWORD=...
# và xoá file này khỏi git.
#
# Lý do dùng Secret thay vì env plaintext: mọi Deployment tham chiếu cùng một
# nguồn, đổi mật khẩu chỉ cần sửa một chỗ.
apiVersion: v1
kind: Secret
metadata:
  name: minio-secret
  namespace: lakehouse
type: Opaque
stringData:
  MINIO_ROOT_USER: admin
  MINIO_ROOT_PASSWORD: password123
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: lakehouse
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres123
